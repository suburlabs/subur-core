# Desenvolupament: docker compose -f docker-compose.dev.yml up -d
# Només Postgres. `pnpm dev`, `pnpm seed` i els tests hi apunten per DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subur
      POSTGRES_PASSWORD: subur
      POSTGRES_DB: subur_{{slug}}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U subur -d subur_{{slug}}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev:
