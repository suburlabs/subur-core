name: client-image

# El CI de tot client de Subur: el client el crida amb `uses: suburlabs/subur-core/.github/workflows/client-image.yml@v<x.y.z>`
# i li passa les seves variables. En `push` a main construeix `web` i `-seed` amb `sha-<revisió>`, hi passa la porta de la
# memòria cau i només llavors promou `latest` per digest; en PR construeix `web` al runner i hi passa la porta sense pujar res.
on:
  workflow_call:
    inputs:
      site_url:
        description: URL pública de la web (NEXT_PUBLIC_SERVER_URL de la imatge)
        required: true
        type: string
      umami_website_id:
        required: false
        type: string
        default: ''
      umami_script_url:
        required: false
        type: string
        default: ''

env:
  DATABASE_URL: postgres://subur:subur@127.0.0.1:5432/subur
  SUBUR_SECRET: ci-only-secret
  PREVIEW_SECRET: ci-only
  CRON_SECRET: ci-only
  NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
  SUBUR_ADMIN_EMAIL: ci@subur.dev
  SUBUR_ADMIN_PASSWORD: ci-only-password

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    # Les proves d'integració del client poden necessitar la base de dades (DATABASE_URL de l'env del workflow)
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: subur, POSTGRES_PASSWORD: subur, POSTGRES_DB: subur }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subur" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Els fitxers propietat del nucli i la comprovació del client (plantilles, tokens, peers, importacions)
      - run: pnpm exec subur sync
      - run: pnpm exec subur check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests del client, si en té
        # En bloc: en un escalar pla, el `: ` del ternari seria un separador de YAML
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:int'] ? 0 : 1)"; then pnpm test:int; else echo "cap script test:int"; fi

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: subur, POSTGRES_PASSWORD: subur, POSTGRES_DB: subur }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subur" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: SITE_URL definida
        if: github.event_name == 'push'
        run: test -n "${{ inputs.site_url }}" || { echo "Falta la variable de repositori SITE_URL"; exit 1; }
      - name: UMAMI_WEBSITE_ID i UMAMI_SCRIPT_URL, totes dues o cap
        env:
          UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
          UMAMI_SCRIPT_URL: ${{ inputs.umami_script_url }}
        run: |
          if { [ -n "$UMAMI_WEBSITE_ID" ] && [ -z "$UMAMI_SCRIPT_URL" ]; } || { [ -z "$UMAMI_WEBSITE_ID" ] && [ -n "$UMAMI_SCRIPT_URL" ]; }; then
            echo "Cal UMAMI_WEBSITE_ID i UMAMI_SCRIPT_URL totes dues o cap"; exit 1
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec subur sync
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,prefix=sha-,format=short
      - name: Imatge web (push, sha-)
        id: web
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ inputs.umami_website_id }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ inputs.umami_script_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imatge web (PR, local)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: subur-web:gate
          build-args: NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:3000
          cache-from: type=gha
      - id: meta_seed
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-seed
          tags: type=sha,prefix=sha-,format=short
      - name: Imatge del seed (push, sha-)
        id: seed
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_seed.outputs.tags }}
          labels: ${{ steps.meta_seed.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ inputs.umami_website_id }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ inputs.umami_script_url }}
          cache-from: type=gha
      - name: Imatge de la porta (push, per digest)
        if: github.event_name == 'push'
        env: { WEB_DIGEST: '${{ steps.web.outputs.digest }}' }
        run: |
          set -eu
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "${repo}@${WEB_DIGEST}"
          echo "GATE_IMAGE=${repo}@${WEB_DIGEST}" >> "$GITHUB_ENV"
      - name: Imatge de la porta (PR)
        if: github.event_name == 'pull_request'
        run: echo "GATE_IMAGE=subur-web:gate" >> "$GITHUB_ENV"
      - name: Migracions i seed des del checkout
        timeout-minutes: 10
        env:
          MEDIA_STORAGE: local
          MEDIA_DIR: ${{ runner.temp }}/media
        run: |
          mkdir -p "$MEDIA_DIR"
          pnpm exec subur migrate
          pnpm seed
      - name: Porta de la memòria cau (imatge real)
        timeout-minutes: 10
        run: pnpm exec subur gate --image "$GATE_IMAGE" --media-dir "$RUNNER_TEMP/media" --docker-net host
      - name: Promoció (latest, només a main)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SEED_DIGEST: ${{ steps.seed.outputs.digest }}
        run: |
          set -eu
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for d in "$SEED_DIGEST" "$WEB_DIGEST"; do [ -n "$d" ] || { echo "Falta un digest de la construcció"; exit 1; }; done
          docker buildx imagetools create -t "${repo}:latest-seed" "${repo}@${SEED_DIGEST}"
          docker buildx imagetools create -t "${repo}:latest" "${repo}@${WEB_DIGEST}"
          echo "${repo}@${WEB_DIGEST} → ${repo}:latest"
